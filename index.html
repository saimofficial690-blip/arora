<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060b22">
  <title>Winter Night</title>
  <link rel="stylesheet" href="style67.css">
</head>
<body>
  <main id="scene" role="img" aria-label="Animated pixel-art winter night with northern lights, a full moon, drifting clouds, snowy mountains and pine trees">
    <canvas id="sky"          class="layer"></canvas> <!-- navy -> purple dithered gradient -->
    <canvas id="stars"        class="layer"></canvas> <!-- twinkling stars -->
    <canvas id="aurora"       class="layer"></canvas> <!-- layered aurora curtains -->
    <canvas id="moon"         class="layer"></canvas> <!-- fixed full moon + pixel glow -->
    <canvas id="clouds"       class="layer"></canvas> <!-- three drifting cloud layers -->
    <canvas id="mtn-far"      class="layer"></canvas> <!-- distant snowy mountains -->
    <canvas id="mtn-near"     class="layer"></canvas> <!-- nearer snowy mountains -->
    <canvas id="forest-far"   class="layer"></canvas> <!-- distant pines + snow hill -->
    <canvas id="mist"         class="layer"></canvas> <!-- thin drifting pixel mist -->
    <canvas id="forest-mid"   class="layer"></canvas> <!-- mid pines + moonlit snow -->
    <canvas id="reflect"      class="layer"></canvas> <!-- turquoise aurora glints on snow -->
    <canvas id="forest-front" class="layer"></canvas> <!-- dark foreground pines + snow -->
    <canvas id="snow"         class="layer"></canvas> <!-- falling snow -->
  </main>
  <script src="script67.js"></script>
</body>
</html>
